<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: deja que la app ocupe también la zona del notch/isla del iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hábitos</title>

  <!-- PWA estándar: el manifest describe la app (nombre, iconos, colores) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Específico de iOS: Safari usa estas etiquetas al "Añadir a pantalla de inicio" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hábitos">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Toda la interfaz se dibuja desde js/app.js dentro de este contenedor -->
  <main id="app"></main>

  <!-- Hoja inferior (bottom sheet) para crear/editar hábitos -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" hidden></section>

  <!-- type="module" permite usar import/export entre archivos JS -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
